<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Documentación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        
        .toolbar .btn {
            margin: 0;
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .filter-group label {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }
        
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-clear {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-clear:hover {
            background: #c53030;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .form-section.visible {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #e53e3e;
        }
        
        .btn-danger:hover {
            background: #c53030;
        }
        
        .btn-success {
            background: #38a169;
        }
        
        .btn-success:hover {
            background: #2f855a;
        }
        
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        
        .btn-add {
            background: #38a169;
        }
        
        .btn-add:hover {
            background: #2f855a;
        }
        
        .btn-cancel {
            background: #718096;
        }
        
        .btn-cancel:hover {
            background: #4a5568;
        }
        
        .table-container {
            overflow-x: auto;
            margin-top: 10px;
        }
        
        .table-wrapper {
            position: relative;
            overflow: auto;
            max-height: 550px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 10px 8px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }
        
        td {
            padding: 8px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        /* Estados de la columna Estado */
        .status-ok {
            background-color: #c6f6d5 !important;
            color: #22543d;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .status-warning {
            background-color: #fefcbf !important;
            color: #744210;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .status-danger {
            background-color: #fed7d7 !important;
            color: #742a2a;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        
        /* Formato condicional para celdas de fecha */
        .date-ok {
            background-color: #c6f6d5 !important;
            color: #22543d;
            font-weight: 600;
        }
        
        .date-warning {
            background-color: #fefcbf !important;
            color: #744210;
            font-weight: 600;
        }
        
        .date-danger {
            background-color: #fed7d7 !important;
            color: #742a2a;
            font-weight: 600;
        }
        
        .file-link {
            color: #667eea;
            text-decoration: none;
        }
        
        .file-link:hover {
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        
        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }
        
        .required {
            color: #e53e3e;
        }
        
        .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 700px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-close {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 30px;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .record-count {
            color: #666;
            font-size: 14px;
            margin-left: 10px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                width: 100%;
            }
            
            .modal-content {
                margin: 10% auto;
                padding: 20px;
                width: 95%;
            }
            
            table {
                font-size: 11px;
            }
            
            th, td {
                padding: 5px;
            }
            
            .toolbar {
                flex-direction: column;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .filter-group input {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚛 Sistema de Gestión de Documentación</h1>
        <p class="subtitle">Control de vencimientos de documentación</p>
        
        <div id="alert-container"></div>
        
        <div class="tabs" id="tabs">
            <button class="tab active" data-sheet="Camion T1">🚚 Camión T1</button>
            <button class="tab" data-sheet="Camion T2">🚛 Camión T2</button>
            <button class="tab" data-sheet="Autoelevadores">🏗️ Autoelevadores</button>
            <button class="tab" data-sheet="Choferes y Ayudantes">👨‍✈️ Choferes y Ayudantes</button>
        </div>
        
        <div id="tab-content">
            <!-- El contenido de las tabs se carga dinámicamente -->
        </div>
    </div>
    
    <!-- Modal para editar -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2>✏️ Editar Documento</h2>
            <form id="editForm">
                <input type="hidden" id="editSheetName">
                <input type="hidden" id="editRowNumber">
                <div id="editFormFields">
                    <!-- Los campos se generan dinámicamente -->
                </div>
                <button type="submit" class="btn btn-success">💾 Guardar Cambios</button>
            </form>
        </div>
    </div>
    
    <script>
        // Variables globales
        let currentSheet = 'Camion T1';
        let dataCache = {};
        let currentHeaders = [];
        let allRows = [];
        let filteredRows = [];
        let isFormVisible = false;
        
        // Definición de columnas a mostrar por pestaña
        const columnConfig = {
            'Camion T1': [
                'PATENTE', 'PROPIETARIO', 'MAIL', 'CIA SEGURO', 'VENC VTV', 
                'VENC SEGURO', 'SENASA', 'LICENCIA DE CONDUCIR', 'PAGO MONOTRIBUTO', 
                'POLIZA DE SEGUROS', 'SEGURO DE ACCIDENTES PERSONALES', 
                'CLAUSULA DE NO REPETICION', 'INDUCCION DE CMQ', 
                'CAPACITACION DE MANEJO DEFENSIVO'
            ],
            'Camion T2': [
                'PATENTE', 'CIA SEGURO', 'AÑO', 'VENC VTV', 'VENC SEGURO', 
                'UTA', 'EXTINTOR', 'BOTIQUIN'
            ],
            'Autoelevadores': [
                'CODIGO DE AE', 'CIA SEGURO', 'AÑO', 'VENC SEGURO', 'EXTINTOR'
            ],
            'Choferes y Ayudantes': [
                'APELLIDO Y NOMBRE', 'CONTRATACION', 'Mail', 
                'VENCIMIENTO REGISTRO', 'LIBRETA SANITARIA'
            ]
        };
        
        // Columnas que deben tener formato condicional de fechas
        const dateColumns = ['VENC VTV', 'VENC SEGURO', 'UTA', 'EXTINTOR', 'BOTIQUIN'];
        
        // Mapeo de filtros por pestaña
        const filterFields = {
            'Camion T1': 'PATENTE',
            'Camion T2': 'PATENTE',
            'Autoelevadores': 'CODIGO DE AE',
            'Choferes y Ayudantes': 'APELLIDO Y NOMBRE'
        };
        
        // Función para mostrar alertas
        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
        
        // Función para calcular el estado de una fecha
        function getDateStatus(dateStr) {
            if (!dateStr) return { class: '', text: '' };
            
            let expDate = null;
            
            // Intentar parsear fecha en formato DD/MM/YYYY
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                if (parts.length === 3) {
                    expDate = new Date(parts[2], parts[1] - 1, parts[0]);
                }
            } else {
                expDate = new Date(dateStr);
            }
            
            if (isNaN(expDate.getTime())) {
                return { class: '', text: '' };
            }
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            expDate.setHours(0, 0, 0, 0);
            
            const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
            
            // Lógica corregida:
            // Verde: > 30 días
            // Amarillo: entre 0 y 30 días
            // Rojo: < 0 días (vencido)
            if (diffDays < 0) {
                return { class: 'date-danger', text: 'VENCIDO' };
            } else if (diffDays >= 0 && diffDays <= 30) {
                return { class: 'date-warning', text: `${diffDays} días` };
            } else {
                return { class: 'date-ok', text: `${diffDays} días` };
            }
        }
        
        // Función para calcular el estado general de la fila
        function getRowStatus(row) {
            let hasDate = false;
            let anyExpired = false;
            let anyWarning = false;
            let anyOk = false;
            
            dateColumns.forEach(col => {
                if (row[col]) {
                    hasDate = true;
                    const status = getDateStatus(row[col]);
                    if (status.class === 'date-danger') anyExpired = true;
                    else if (status.class === 'date-warning') anyWarning = true;
                    else if (status.class === 'date-ok') anyOk = true;
                }
            });
            
            if (!hasDate) {
                return { class: 'status-ok', text: '✅ Sin fechas' };
            }
            
            // Prioridad: si hay alguna vencida -> VENCIDO
            // Si hay alguna entre 0 y 30 días -> Cerca de vencimiento
            // Si todas son > 30 días -> OK
            if (anyExpired) {
                return { class: 'status-danger', text: '🔴 VENCIDO' };
            } else if (anyWarning) {
                return { class: 'status-warning', text: '🟡 Cerca de vencimiento' };
            } else {
                return { class: 'status-ok', text: '✅ OK' };
            }
        }
        
        // Función para obtener las columnas a mostrar según la pestaña
        function getDisplayColumns(sheetName) {
            const columns = columnConfig[sheetName] || [];
            return [...columns, 'Marca Temporal'];
        }
        
        // Función para cargar datos de una hoja
        async function loadSheetData(sheetName) {
            const content = document.getElementById('tab-content');
            content.innerHTML = '<div class="loading">🔄 Cargando datos...</div>';
            
            try {
                const response = await fetch(`/api/sheet/${encodeURIComponent(sheetName)}`);
                const data = await response.json();
                dataCache[sheetName] = data;
                currentHeaders = data.headers || [];
                allRows = data.rows || [];
                filteredRows = [...allRows];
                renderTable(sheetName);
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">❌ Error al cargar datos: ${error.message}</div>`;
            }
        }
        
        // Función para generar campos del formulario dinámicamente
        function generateFormFields(headers, excludeFields = ['_row_number', 'Marca Temporal'], values = {}) {
            let html = '';
            
            headers.forEach(header => {
                if (excludeFields.includes(header)) return;
                
                const isDate = header.toUpperCase().includes('FECHA') || header.toUpperCase().includes('VENCIMIENTO') || header.toUpperCase().includes('VENC');
                const isTextarea = header.toUpperCase().includes('OBSERVACION') || header.toUpperCase().includes('COMENTARIO');
                const value = values[header] || '';
                
                html += `<div class="form-group">`;
                html += `<label>${header}</label>`;
                
                if (isTextarea) {
                    html += `<textarea id="field_${header}" name="${header}" rows="2">${value}</textarea>`;
                } else if (isDate) {
                    let dateValue = value;
                    if (value && value.includes('/')) {
                        const parts = value.split('/');
                        if (parts.length === 3) {
                            dateValue = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                    }
                    html += `<input type="date" id="field_${header}" name="${header}" value="${dateValue}">`;
                } else {
                    html += `<input type="text" id="field_${header}" name="${header}" value="${value}">`;
                }
                
                html += `</div>`;
            });
            
            return html;
        }
        
        // Función para renderizar la tabla
        function renderTable(sheetName) {
            const content = document.getElementById('tab-content');
            
            const displayColumns = getDisplayColumns(sheetName);
            const filterField = filterFields[sheetName] || 'PATENTE';
            
            let html = `
                <!-- Toolbar -->
                <div class="toolbar">
                    <button class="btn btn-add" onclick="toggleForm()">
                        ${isFormVisible ? '❌ Ocultar Formulario' : '➕ Agregar Nuevo'}
                    </button>
                    <div class="filter-group">
                        <label>🔍 Filtrar por ${filterField}:</label>
                        <input type="text" id="filterInput" placeholder="Buscar..." oninput="applyFilter('${sheetName}')">
                        <button class="btn-clear" onclick="clearFilter()">✖ Limpiar</button>
                    </div>
                    <span class="record-count">📊 Total: ${filteredRows.length} registros</span>
                </div>
                
                <!-- Formulario de agregar -->
                <div class="form-section ${isFormVisible ? 'visible' : ''}" id="addFormSection">
                    <h3>📄 Agregar nuevo documento</h3>
                    <form id="addForm" enctype="multipart/form-data">
                        <div class="form-row" id="addFormFields">
                            ${generateFormFields(displayColumns)}
                        </div>
                        <div class="form-group">
                            <label>📎 Subir Foto (opcional)</label>
                            <input type="file" id="foto" name="foto" accept="image/*">
                        </div>
                        <input type="hidden" id="sheetName" value="${sheetName}">
                        <button type="submit" class="btn">➕ Agregar Documento</button>
                        <button type="button" class="btn btn-cancel" onclick="toggleForm()">Cancelar</button>
                    </form>
                </div>
            `;
            
            html += `<div class="table-wrapper"><div class="table-container"><table>`;
            
            html += `<thead><tr>`;
            html += `<th>📊 Estado</th>`;
            displayColumns.forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += `<th>⚙️ Acciones</th>`;
            html += `</tr></thead><tbody>`;
            
            if (filteredRows.length === 0) {
                html += `<tr><td colspan="${displayColumns.length + 2}" style="text-align: center; padding: 20px;">📭 No hay documentos</td></tr>`;
            } else {
                filteredRows.forEach((row) => {
                    html += `<tr>`;
                    
                    // Columna Estado
                    const rowStatus = getRowStatus(row);
                    html += `<td><span class="${rowStatus.class}">${rowStatus.text}</span></td>`;
                    
                    displayColumns.forEach(col => {
                        let value = row[col] || '';
                        let cellClass = '';
                        
                        // Aplicar formato condicional a columnas de fecha específicas
                        if (dateColumns.includes(col) && value) {
                            const dateStatus = getDateStatus(value);
                            if (dateStatus.class) {
                                cellClass = ` class="${dateStatus.class}"`;
                            }
                        }
                        
                        // Si es URL, mostrar como link
                        if (value.startsWith('http') && (value.includes('drive') || value.includes('docs'))) {
                            value = `<a href="${value}" target="_blank" class="file-link">📎 Ver archivo</a>`;
                        }
                        
                        html += `<
