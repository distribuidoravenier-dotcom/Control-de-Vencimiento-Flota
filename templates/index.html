<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Documentación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        
        .toolbar .btn {
            margin: 0;
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .filter-group label {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }
        
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-clear {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-clear:hover {
            background: #c53030;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .form-section.visible {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #e53e3e;
        }
        
        .btn-danger:hover {
            background: #c53030;
        }
        
        .btn-success {
            background: #38a169;
        }
        
        .btn-success:hover {
            background: #2f855a;
        }
        
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        
        .btn-add {
            background: #38a169;
        }
        
        .btn-add:hover {
            background: #2f855a;
        }
        
        .btn-cancel {
            background: #718096;
        }
        
        .btn-cancel:hover {
            background: #4a5568;
        }
        
        .table-container {
            overflow-x: auto;
            margin-top: 10px;
        }
        
        .table-wrapper {
            position: relative;
            overflow: auto;
            max-height: 550px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 10px 8px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }
        
        td {
            padding: 8px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .status-ok {
            background-color: #c6f6d5 !important;
            color: #22543d;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 3px;
            display: inline-block;
        }
        
        .status-warning {
            background-color: #fefcbf !important;
            color: #744210;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 3px;
            display: inline-block;
        }
        
        .status-danger {
            background-color: #fed7d7 !important;
            color: #742a2a;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 3px;
            display: inline-block;
        }
        
        .status-expired {
            background-color: #e53e3e !important;
            color: white;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 3px;
            display: inline-block;
        }
        
        .file-link {
            color: #667eea;
            text-decoration: none;
        }
        
        .file-link:hover {
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        
        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }
        
        .required {
            color: #e53e3e;
        }
        
        .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 700px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-close {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 30px;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .record-count {
            color: #666;
            font-size: 14px;
            margin-left: 10px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                width: 100%;
            }
            
            .modal-content {
                margin: 10% auto;
                padding: 20px;
                width: 95%;
            }
            
            table {
                font-size: 11px;
            }
            
            th, td {
                padding: 5px;
            }
            
            .toolbar {
                flex-direction: column;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .filter-group input {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚛 Sistema de Gestión de Documentación</h1>
        <p class="subtitle">Control de vencimientos de documentación</p>
        
        <div id="alert-container"></div>
        
        <div class="tabs" id="tabs">
            <button class="tab active" data-sheet="Camion T1">🚚 Camión T1</button>
            <button class="tab" data-sheet="Camion T2">🚛 Camión T2</button>
            <button class="tab" data-sheet="Autoelevadores">🏗️ Autoelevadores</button>
            <button class="tab" data-sheet="Choferes y Ayudantes">👨‍✈️ Choferes y Ayudantes</button>
        </div>
        
        <div id="tab-content">
            <!-- El contenido de las tabs se carga dinámicamente -->
        </div>
    </div>
    
    <!-- Modal para editar -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2>✏️ Editar Documento</h2>
            <form id="editForm">
                <input type="hidden" id="editSheetName">
                <input type="hidden" id="editRowNumber">
                <div id="editFormFields">
                    <!-- Los campos se generan dinámicamente -->
                </div>
                <button type="submit" class="btn btn-success">💾 Guardar Cambios</button>
            </form>
        </div>
    </div>
    
    <script>
        // Variables globales
        let currentSheet = 'Camion T1';
        let dataCache = {};
        let currentHeaders = [];
        let allRows = [];
        let filteredRows = [];
        let isFormVisible = false;
        
        // Mapeo de filtros por pestaña
        const filterFields = {
            'Camion T1': 'PATENTE',
            'Camion T2': 'PATENTE',
            'Autoelevadores': 'CODIGO DE AE',
            'Choferes y Ayudantes': 'APELLIDO Y NOMBRE'
        };
        
        // Función para mostrar alertas
        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
        
        // Función para calcular estado del vencimiento
        function getStatus(expirationDate) {
            if (!expirationDate) return { class: 'status-ok', text: 'Sin fecha' };
            
            let expDate = null;
            
            if (expirationDate.includes('/')) {
                const parts = expirationDate.split('/');
                if (parts.length === 3) {
                    expDate = new Date(parts[2], parts[1] - 1, parts[0]);
                }
            } else {
                expDate = new Date(expirationDate);
            }
            
            if (isNaN(expDate.getTime())) {
                return { class: 'status-ok', text: 'Fecha inválida' };
            }
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            expDate.setHours(0, 0, 0, 0);
            
            const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                return { class: 'status-expired', text: '⚠️ VENCIDO' };
            } else if (diffDays < 7) {
                return { class: 'status-danger', text: `🔴 ${diffDays} días` };
            } else if (diffDays <= 30) {
                return { class: 'status-warning', text: `🟡 ${diffDays} días` };
            } else {
                return { class: 'status-ok', text: `✅ ${diffDays} días` };
            }
        }
        
        // Función para cargar datos de una hoja
        async function loadSheetData(sheetName) {
            const content = document.getElementById('tab-content');
            content.innerHTML = '<div class="loading">🔄 Cargando datos...</div>';
            
            try {
                const response = await fetch(`/api/sheet/${encodeURIComponent(sheetName)}`);
                const data = await response.json();
                dataCache[sheetName] = data;
                currentHeaders = data.headers || [];
                allRows = data.rows || [];
                filteredRows = [...allRows];
                renderTable(sheetName);
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">❌ Error al cargar datos: ${error.message}</div>`;
            }
        }
        
        // Función para generar campos del formulario dinámicamente
        function generateFormFields(headers, excludeFields = ['_row_number'], values = {}) {
            let html = '';
            
            headers.forEach(header => {
                if (excludeFields.includes(header)) return;
                
                const isDate = header.toUpperCase().includes('FECHA') || header.toUpperCase().includes('VENCIMIENTO');
                const isTextarea = header.toUpperCase().includes('OBSERVACION') || header.toUpperCase().includes('COMENTARIO');
                const value = values[header] || '';
                
                html += `<div class="form-group">`;
                html += `<label>${header}</label>`;
                
                if (isTextarea) {
                    html += `<textarea id="field_${header}" name="${header}" rows="2">${value}</textarea>`;
                } else if (isDate) {
                    let dateValue = value;
                    if (value && value.includes('/')) {
                        const parts = value.split('/');
                        if (parts.length === 3) {
                            dateValue = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                    }
                    html += `<input type="date" id="field_${header}" name="${header}" value="${dateValue}">`;
                } else {
                    html += `<input type="text" id="field_${header}" name="${header}" value="${value}">`;
                }
                
                html += `</div>`;
            });
            
            return html;
        }
        
        // Función para renderizar la tabla
        function renderTable(sheetName) {
            const content = document.getElementById('tab-content');
            
            const headers = currentHeaders;
            const displayHeaders = headers.filter(h => h !== '_row_number');
            
            // Buscar columna de fecha para el estado
            let dateColumn = displayHeaders.find(h => 
                h.toUpperCase().includes('FECHA') || 
                h.toUpperCase().includes('VENCIMIENTO')
            );
            
            if (!dateColumn) {
                dateColumn = displayHeaders.find(h => 
                    h.includes('/') || h.includes('-')
                );
            }
            
            // Obtener el campo de filtro según la pestaña
            const filterField = filterFields[sheetName] || 'PATENTE';
            
            let html = `
                <!-- Toolbar -->
                <div class="toolbar">
                    <button class="btn btn-add" onclick="toggleForm()">
                        ${isFormVisible ? '❌ Ocultar Formulario' : '➕ Agregar Nuevo'}
                    </button>
                    <div class="filter-group">
                        <label>🔍 Filtrar por ${filterField}:</label>
                        <input type="text" id="filterInput" placeholder="Buscar..." oninput="applyFilter('${sheetName}')">
                        <button class="btn-clear" onclick="clearFilter()">✖ Limpiar</button>
                    </div>
                    <span class="record-count">📊 Total: ${filteredRows.length} registros</span>
                </div>
                
                <!-- Formulario de agregar -->
                <div class="form-section ${isFormVisible ? 'visible' : ''}" id="addFormSection">
                    <h3>📄 Agregar nuevo documento</h3>
                    <form id="addForm" enctype="multipart/form-data">
                        <div class="form-row" id="addFormFields">
                            ${generateFormFields(displayHeaders)}
                        </div>
                        <div class="form-group">
                            <label>📎 Subir Foto (opcional)</label>
                            <input type="file" id="foto" name="foto" accept="image/*">
                        </div>
                        <input type="hidden" id="sheetName" value="${sheetName}">
                        <button type="submit" class="btn">➕ Agregar Documento</button>
                        <button type="button" class="btn btn-cancel" onclick="toggleForm()">Cancelar</button>
                    </form>
                </div>
            `;
            
            html += `<div class="table-wrapper"><div class="table-container"><table>`;
            
            html += `<thead><tr>`;
            html += `<th>📊 Estado</th>`;
            displayHeaders.forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += `<th>⚙️ Acciones</th>`;
            html += `</tr></thead><tbody>`;
            
            if (filteredRows.length === 0) {
                html += `<tr><td colspan="${displayHeaders.length + 2}" style="text-align: center; padding: 20px;">📭 No hay documentos</td></tr>`;
            } else {
                filteredRows.forEach((row) => {
                    html += `<tr>`;
                    
                    let fechaVenc = '';
                    if (dateColumn && row[dateColumn]) {
                        fechaVenc = row[dateColumn];
                    } else {
                        for (let key in row) {
                            if (key !== '_row_number' && row[key] && (row[key].includes('/') || row[key].includes('-'))) {
                                fechaVenc = row[key];
                                break;
                            }
                        }
                    }
                    
                    const status = getStatus(fechaVenc);
                    html += `<td><span class="${status.class}">${status.text}</span></td>`;
                    
                    displayHeaders.forEach(col => {
                        let value = row[col] || '';
                        if (value.startsWith('http') && (value.includes('drive') || value.includes('docs'))) {
                            value = `<a href="${value}" target="_blank" class="file-link">📎 Ver archivo</a>`;
                        }
                        html += `<td>${value}</td>`;
                    });
                    
                    html += `<td>
                        <div class="actions">
                            <button class="btn btn-success btn-sm" onclick="editRow('${sheetName}', ${row._row_number})">✏️ Editar</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteRow('${sheetName}', ${row._row_number})">🗑️ Eliminar</button>
                        </div>
                    </td>`;
                    
                    html += `</tr>`;
                });
            }
            
            html += `</tbody></table></div></div>`;
            content.innerHTML = html;
            
            // Event listener para el formulario de agregar
            const form = document.getElementById('addForm');
            if (form) {
                form.addEventListener('submit', handleAddDocument);
            }
        }
        
        // Función para mostrar/ocultar el formulario
        function toggleForm() {
            isFormVisible = !isFormVisible;
            renderTable(currentSheet);
        }
        
        // Función para aplicar filtro
        function applyFilter(sheetName) {
            const filterInput = document.getElementById('filterInput');
            const searchTerm = filterInput.value.toLowerCase().trim();
            const filterField = filterFields[sheetName] || 'PATENTE';
            
            if (!searchTerm) {
                filteredRows = [...allRows];
            } else {
                filteredRows = allRows.filter(row => {
                    const value = (row[filterField] || '').toString().toLowerCase();
                    return value.includes(searchTerm);
                });
            }
            
            renderTable(sheetName);
        }
        
        // Función para limpiar filtro
        function clearFilter() {
            const filterInput = document.getElementById('filterInput');
            filterInput.value = '';
            filteredRows = [...allRows];
            renderTable(currentSheet);
        }
        
        // Función para manejar el envío del formulario de agregar
        async function handleAddDocument(e) {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const sheetName = formData.get('sheet_name');
            
            try {
                const response = await fetch('/api/add', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('✅ Documento agregado correctamente', 'success');
                    form.reset();
                    isFormVisible = false;
                    await loadSheetData(sheetName);
                } else {
                    showAlert(`❌ Error: ${result.error}`, 'error');
                }
            } catch (error) {
                showAlert(`❌ Error al enviar el formulario: ${error.message}`, 'error');
            }
        }
        
        // Función para editar una fila
        function editRow(sheetName, rowNumber) {
            const row = allRows.find(r => r._row_number === rowNumber);
            
            if (!row) {
                showAlert('No se encontró el documento', 'error');
                return;
            }
            
            const headers = currentHeaders;
            const displayHeaders = headers.filter(h => h !== '_row_number');
            
            document.getElementById('editSheetName').value = sheetName;
            document.getElementById('editRowNumber').value = rowNumber;
            
            let html = '';
            displayHeaders.forEach(header => {
                const value = row[header] || '';
                const isDate = header.toUpperCase().includes('FECHA') || header.toUpperCase().includes('VENCIMIENTO');
                const isTextarea = header.toUpperCase().includes('OBSERVACION') || header.toUpperCase().includes('COMENTARIO');
                
                html += `<div class="form-group">`;
                html += `<label>${header}</label>`;
                
                if (isTextarea) {
                    html += `<textarea id="edit_${header}" name="${header}" rows="2">${value}</textarea>`;
                } else if (isDate) {
                    let dateValue = value;
                    if (value && value.includes('/')) {
                        const parts = value.split('/');
                        if (parts.length === 3) {
                            dateValue = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                    }
                    html += `<input type="date" id="edit_${header}" name="${header}" value="${dateValue}">`;
                } else {
                    html += `<input type="text" id="edit_${header}" name="${header}" value="${value}">`;
                }
                
                html += `</div>`;
            });
            
            document.getElementById('editFormFields').innerHTML = html;
            document.getElementById('editModal').style.display = 'block';
        }
        
        // Función para cerrar el modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
        
        // Event listener para el formulario de edición
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sheetName = document.getElementById('editSheetName').value;
            const rowNumber = parseInt(document.getElementById('editRowNumber').value);
            
            const formData = {};
            const inputs = this.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                if (input.name) {
                    formData[input.name] = input.value;
                }
            });
            
            try {
                const response = await fetch(`/api/update/${encodeURIComponent(sheetName)}/${rowNumber}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('✅ Documento actualizado correctamente', 'success');
                    closeEditModal();
                    await loadSheetData(sheetName);
                } else {
                    showAlert(`❌ Error: ${result.error}`, 'error');
                }
            } catch (error) {
                showAlert(`❌ Error al actualizar: ${error.message}`, 'error');
            }
        });
        
        // Función para eliminar una fila
        async function deleteRow(sheetName, rowNumber) {
            if (!confirm('¿Estás seguro de que deseas eliminar este documento?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/delete/${encodeURIComponent(sheetName)}/${rowNumber}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('✅ Documento eliminado correctamente', 'success');
                    await loadSheetData(sheetName);
                } else {
                    showAlert(`❌ Error: ${result.error}`, 'error');
                }
            } catch (error) {
                showAlert(`❌ Error al eliminar: ${error.message}`, 'error');
            }
        }
        
        // Configurar tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const sheetName = this.dataset.sheet;
                currentSheet = sheetName;
                isFormVisible = false;
                loadSheetData(sheetName);
            });
        });
        
        // Cargar datos iniciales
        loadSheetData('Camion T1');
    </script>
</body>
</html>
