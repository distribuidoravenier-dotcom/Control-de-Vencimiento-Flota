<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Documentación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #e53e3e;
        }
        
        .btn-danger:hover {
            background: #c53030;
        }
        
        .btn-success {
            background: #38a169;
        }
        
        .btn-success:hover {
            background: #2f855a;
        }
        
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .status-ok {
            color: #38a169;
            font-weight: 600;
        }
        
        .status-warning {
            color: #dd6b20;
            font-weight: 600;
        }
        
        .status-danger {
            color: #e53e3e;
            font-weight: 600;
        }
        
        .status-expired {
            color: #c53030;
            font-weight: 600;
            background: #fed7d7;
            padding: 3px 8px;
            border-radius: 3px;
        }
        
        .file-link {
            color: #667eea;
            text-decoration: none;
        }
        
        .file-link:hover {
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        
        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }
        
        .required {
            color: #e53e3e;
        }
        
        .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 30px;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                width: 100%;
            }
            
            .modal-content {
                margin: 10% auto;
                padding: 20px;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚛 Sistema de Gestión de Documentación</h1>
        <p class="subtitle">Control de vencimientos de documentación</p>
        
        <div id="alert-container"></div>
        
        <div class="tabs" id="tabs">
            <button class="tab active" data-sheet="Camion T1">🚚 Camión T1</button>
            <button class="tab" data-sheet="Camion T2">🚛 Camión T2</button>
            <button class="tab" data-sheet="Autoelevadores">🏗️ Autoelevadores</button>
            <button class="tab" data-sheet="Choferes y Ayudantes">👨‍✈️ Choferes y Ayudantes</button>
        </div>
        
        <div id="tab-content">
            <!-- El contenido de las tabs se carga dinámicamente -->
        </div>
    </div>
    
    <!-- Modal para editar -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2>Editar Documento</h2>
            <form id="editForm">
                <input type="hidden" id="editSheetName">
                <input type="hidden" id="editRowNumber">
                <div class="form-group">
                    <label>Patente</label>
                    <input type="text" id="editPatente" required>
                </div>
                <div class="form-group">
                    <label>Documento</label>
                    <input type="text" id="editDocumento" required>
                </div>
                <div class="form-group">
                    <label>Fecha de Vencimiento</label>
                    <input type="date" id="editFechaVencimiento" required>
                </div>
                <div class="form-group">
                    <label>URL de Foto</label>
                    <input type="text" id="editDriveUrl" placeholder="URL de Google Drive">
                </div>
                <div class="form-group">
                    <label>Observaciones</label>
                    <textarea id="editObservaciones" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-success">Guardar Cambios</button>
            </form>
        </div>
    </div>
    
    <script>
        // Variables globales
        let currentSheet = 'Camion T1';
        let dataCache = {};
        
        // Función para mostrar alertas
        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
        
        // Función para formatear fecha
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }
        
        // Función para calcular estado del vencimiento
        function getStatus(expirationDate) {
            if (!expirationDate) return { class: '', text: 'Sin fecha' };
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expDate = new Date(expirationDate);
            expDate.setHours(0, 0, 0, 0);
            
            const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                return { class: 'status-expired', text: '⚠️ VENCIDO' };
            } else if (diffDays <= 30) {
                return { class: 'status-danger', text: `🔴 ${diffDays} días` };
            } else if (diffDays <= 90) {
                return { class: 'status-warning', text: `🟡 ${diffDays} días` };
            } else {
                return { class: 'status-ok', text: `✅ ${diffDays} días` };
            }
        }
        
        // Función para cargar datos de una hoja
        async function loadSheetData(sheetName) {
            const content = document.getElementById('tab-content');
            content.innerHTML = '<div class="loading">Cargando datos...</div>';
            
            try {
                const response = await fetch(`/api/sheet/${encodeURIComponent(sheetName)}`);
                const data = await response.json();
                dataCache[sheetName] = data;
                renderTable(sheetName, data);
            } catch (error) {
                content.innerHTML = `<div class="alert alert-error">Error al cargar datos: ${error.message}</div>`;
            }
        }
        
        // Función para renderizar la tabla
        function renderTable(sheetName, data) {
            const content = document.getElementById('tab-content');
            
            // Verificar que data sea un objeto con headers y rows
            const headers = data.headers || [];
            const rows = data.rows || [];
            
            let html = `
                <div class="form-section">
                    <h3>Agregar nuevo documento</h3>
                    <form id="addForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Patente <span class="required">*</span></label>
                                <input type="text" id="patente" placeholder="ABC123" required>
                            </div>
                            <div class="form-group">
                                <label>Documento <span class="required">*</span></label>
                                <input type="text" id="documento" placeholder="Nombre del documento" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Fecha de Vencimiento <span class="required">*</span></label>
                                <input type="date" id="fechaVencimiento" required>
                            </div>
                            <div class="form-group">
                                <label>Foto del documento</label>
                                <input type="file" id="foto" accept="image/*">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Observaciones</label>
                            <textarea id="observaciones" rows="2" placeholder="Observaciones adicionales"></textarea>
                        </div>
                        <input type="hidden" id="sheetName" value="${sheetName}">
                        <button type="submit" class="btn">Agregar Documento</button>
                    </form>
                </div>
            `;
            
            html += `<div class="table-container"><table>`;
            
            // Definir columnas a mostrar
            const columnOrder = ['Patente', 'Documento', 'Fecha Vencimiento', 'Link', 'Observaciones', 'Fecha de carga'];
            const displayColumns = columnOrder.filter(col => headers.includes(col));
            
            html += `<thead><tr>`;
            html += `<th>Estado</th>`;
            displayColumns.forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += `<th>Acciones</th>`;
            html += `</tr></thead><tbody>`;
            
            if (rows.length === 0) {
                html += `<tr><td colspan="${displayColumns.length + 2}" style="text-align: center; padding: 20px;">No hay documentos cargados</td></tr>`;
            } else {
                rows.forEach((row) => {
                    html += `<tr>`;
                    
                    // Columna de estado
                    const fechaVenc = row['Fecha Vencimiento'] || '';
                    const status = getStatus(fechaVenc);
                    html += `<td><span class="${status.class}">${status.text}</span></td>`;
                    
                    displayColumns.forEach(col => {
                        let value = row[col] || '';
                        if (col === 'Link' && value) {
                            value = `<a href="${value}" target="_blank" class="file-link">📎 Ver archivo</a>`;
                        }
                        html += `<td>${value}</td>`;
                    });
                    
                    // Acciones
                    html += `<td>
                        <div class="actions">
                            <button class="btn btn-success btn-sm" onclick="editRow('${sheetName}', ${row._row_number})">✏️ Editar</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteRow('${sheetName}', ${row._row_number})">🗑️ Eliminar</button>
                        </div>
                    </td>`;
                    
                    html += `</tr>`;
                });
            }
            
            html += `</tbody></table></div>`;
            content.innerHTML = html;
            
            // Event listener para el formulario de agregar
            document.getElementById('addForm').addEventListener('submit', handleAddDocument);
        }
        
        // Función para manejar el envío del formulario de agregar
        async function handleAddDocument(e) {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            
            const patente = formData.get('patente');
            const documento = formData.get('documento');
            const fechaVencimiento = formData.get('fechaVencimiento');
            const foto = formData.get('foto');
            
            if (!patente || !documento || !fechaVencimiento) {
                showAlert('Patente, Documento y Fecha de Vencimiento son obligatorios', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/add', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('Documento agregado correctamente', 'success');
                    form.reset();
                    const sheetName = formData.get('sheet_name') || document.getElementById('sheetName').value;
                    loadSheetData(sheetName);
                } else {
                    showAlert(`Error: ${result.error}`, 'error');
                }
            } catch (error) {
                showAlert(`Error al enviar el formulario: ${error.message}`, 'error');
            }
        }
        
        // Función para editar una fila
        function editRow(sheetName, rowNumber) {
            const rows = dataCache[sheetName]?.rows || [];
            const row = rows.find(r => r._row_number === rowNumber);
            
            if (!row) {
                showAlert('No se encontró el documento', 'error');
                return;
            }
            
            document.getElementById('editSheetName').value = sheetName;
            document.getElementById('editRowNumber').value = rowNumber;
            document.getElementById('editPatente').value = row['Patente'] || '';
            document.getElementById('editDocumento').value = row['Documento'] || '';
            document.getElementById('editFechaVencimiento').value = row['Fecha Vencimiento'] || '';
            document.getElementById('editDriveUrl').value = row['Link'] || '';
            document.getElementById('editObservaciones').value = row['Observaciones'] || '';
            
            document.getElementById('editModal').style.display = 'block';
        }
        
        // Función para cerrar el modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
        
        // Event listener para el formulario de edición
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sheetName = document.getElementById('editSheetName').value;
            const rowNumber = parseInt(document.getElementById('editRowNumber').value);
            
            const data = {
                patente: document.getElementById('editPatente').value,
                documento: document.getElementById('editDocumento').value,
                fecha_vencimiento: document.getElementById('editFechaVencimiento').value,
                drive_url: document.getElementById('editDriveUrl').value,
                observaciones: document.getElementById('editObservaciones').value
            };
            
            try {
                const response = await fetch(`/api/update/${encodeURIComponent(sheetName)}/${rowNumber}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('Documento actualizado correctamente', 'success');
                    closeEditModal();
                    loadSheetData(sheetName);
                } else {
                    showAlert(`Error: ${result.error}`, 'error');
                }
            } catch (error) {
                showAlert(`Error al actualizar: ${error.message}`, 'error');
            }
        });
        
        // Función para eliminar una fila
        async function deleteRow(sheetName, rowNumber) {
            if (!confirm('¿Estás seguro de que deseas eliminar este documento?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/delete/${encodeURIComponent(sheetName)}/${rowNumber}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('Documento eliminado correctamente', 'success');
                    loadSheetData(sheetName);
                } else {
                    showAlert(`Error: ${result.error}`, 'error');
                }
            } catch (error) {
                showAlert(`Error al eliminar: ${error.message}`, 'error');
            }
        }
        
        // Configurar tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const sheetName = this.dataset.sheet;
                currentSheet = sheetName;
                loadSheetData(sheetName);
            });
        });
        
        // Cargar datos iniciales
        loadSheetData('Camion T1');
    </script>
</body>
</html>
