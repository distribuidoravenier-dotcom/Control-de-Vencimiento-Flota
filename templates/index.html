<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Documentación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        
        .toolbar .btn {
            margin: 0;
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
        }
        
        .filter-group label {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }
        
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-clear {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-clear:hover {
            background: #c53030;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .form-section.visible {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .form-group input[type="file"] {
            padding: 8px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #e53e3e;
        }
        
        .btn-danger:hover {
            background: #c53030;
        }
        
        .btn-success {
            background: #38a169;
        }
        
        .btn-success:hover {
            background: #2f855a;
        }
        
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        
        .btn-add {
            background: #38a169;
        }
        
        .btn-add:hover {
            background: #2f855a;
        }
        
        .btn-cancel {
            background: #718096;
        }
        
        .btn-cancel:hover {
            background: #4a5568;
        }
        
        .table-container {
            overflow-x: auto;
            margin-top: 10px;
        }
        
        .table-wrapper {
            position: relative;
            overflow: auto;
            max-height: 550px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 10px 8px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }
        
        td {
            padding: 8px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        /* Estados de la columna Estado */
        .status-ok {
            background-color: #c6f6d5 !important;
            color: #22543d;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .status-warning {
            background-color: #fefcbf !important;
            color: #744210;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .status-danger {
            background-color: #fed7d7 !important;
            color: #742a2a;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        
        /* Formato condicional para celdas de fecha */
        .date-ok {
            background-color: #c6f6d5 !important;
            color: #22543d;
            font-weight: 600;
        }
        
        .date-warning {
            background-color: #fefcbf !important;
            color: #744210;
            font-weight: 600;
        }
        
        .date-danger {
            background-color: #fed7d7 !important;
            color: #742a2a;
            font-weight: 600;
        }
        
        .file-link {
            color: #667eea;
            text-decoration: none;
        }
        
        .file-link:hover {
            text-decoration: underline;
        }
        
        .photo-thumb {
            max-width: 40px;
            max-height: 40px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ddd;
            object-fit: cover;
        }
        
        .photo-thumb:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .photo-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        
        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }
        
        .required {
            color: #e53e3e;
        }
        
        .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 800px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-close {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 30px;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .record-count {
            color: #666;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .photo-preview {
            max-width: 100px;
            max-height: 100px;
            border-radius: 8px;
            border: 2px solid #667eea;
            margin-top: 5px;
        }
        
        .photo-upload-group {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }
        
        .photo-upload-group label {
            font-weight: 600;
            color: #333;
        }
        
        .photo-upload-group .current-photo-thumb {
            max-width: 60px;
            max-height: 60px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-top: 5px;
        }
        
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 5px;
            margin-top: 5px;
        }
        
        /* Pantalla de inicio */
        .home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 60px 20px;
        }

        .home-btn {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .home-btn.master-btn {
            background: linear-gradient(135deg, #38a169 0%, #2f855a 100%);
        }

        .home-btn.master-btn:hover {
            box-shadow: 0 10px 25px rgba(56, 161, 105, 0.4);
        }

        .back-home-btn {
            background: #718096;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .back-home-btn:hover {
            background: #4a5568;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                width: 100%;
            }
            
            .modal-content {
                margin: 10% auto;
                padding: 20px;
                width: 95%;
            }
            
            table {
                font-size: 11px;
            }
            
            th, td {
                padding: 5px;
            }
            
            .toolbar {
                flex-direction: column;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .filter-group input {
                min-width: 100px;
            }
            
            .photo-thumb {
                max-width: 30px;
                max-height: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚛 Sistema de Gestión de Documentación</h1>
        <p class="subtitle">Control de vencimientos de documentación</p>
        
        <div id="alert-container"></div>

        <!-- PANTALLA DE INICIO -->
        <div id="homeScreen" class="home-screen">
            <button class="home-btn master-btn" onclick="showModule('master')">🗂️ Maestro de Flota</button>
            <button class="home-btn" onclick="showModule('docs')">📋 Control de Documentación</button>
        </div>

        <!-- MÓDULO: CONTROL DE DOCUMENTACIÓN (funcionalidad original) -->
        <div id="docsModule" style="display:none;">
            <button class="back-home-btn" onclick="showHome()">⬅ Volver al inicio</button>

            <div class="tabs" id="tabsDocs">
                <button class="tab active" data-sheet="Camion T1">🚚 Camión T1</button>
                <button class="tab" data-sheet="Camion T2">🚛 Camión T2</button>
                <button class="tab" data-sheet="Autoelevadores">🏗️ Autoelevadores</button>
                <button class="tab" data-sheet="Choferes y Ayudantes">👨‍✈️ Choferes y Ayudantes</button>
            </div>

            <div id="tab-content">
                <!-- El contenido de las tabs se carga dinámicamente -->
            </div>
        </div>

        <!-- MÓDULO: MAESTRO DE FLOTA (todas las columnas) -->
        <div id="masterModule" style="display:none;">
            <button class="back-home-btn" onclick="showHome()">⬅ Volver al inicio</button>

            <div class="tabs" id="tabsMaster">
                <button class="tab active" data-sheet="Camion T1">🚚 Camión T1</button>
                <button class="tab" data-sheet="Camion T2">🚛 Camión T2</button>
                <button class="tab" data-sheet="Autoelevadores">🏗️ Autoelevadores</button>
                <button class="tab" data-sheet="Choferes y Ayudantes">👨‍✈️ Choferes y Ayudantes</button>
            </div>

            <div id="master-tab-content">
                <!-- El contenido de las tabs se carga dinámicamente -->
            </div>
        </div>
    </div>
    
    <!-- Modal para editar -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2>✏️ Editar Documento</h2>
            <form id="editForm" enctype="multipart/form-data">
                <input type="hidden" id="editSheetName">
                <input type="hidden" id="editRowNumber">
                <div id="editFormFields">
                    <!-- Los campos se generan dinámicamente -->
                </div>
                <div id="editPhotoFields">
                    <!-- Los campos de fotos se generan dinámicamente -->
                </div>
                <button type="submit" class="btn btn-success">💾 Guardar Cambios</button>
            </form>
        </div>
    </div>
    
    <script>
        // Variables globales
        let currentSheet = 'Camion T1';
        let dataCache = {};
        let currentHeaders = [];
        let allRows = [];
        let filteredRows = [];
        let isFormVisible = false;
        let currentEditRow = null;
        let editContextModule = 'docs'; // 'docs' o 'master', indica qué módulo abrió el modal de edición

        // Variables globales para el módulo "Maestro de Flota" (muestra todas las columnas)
        let masterCurrentSheet = 'Camion T1';
        let masterDataCache = {};
        let masterCurrentHeaders = [];
        let masterAllRows = [];
        let masterFilteredRows = [];
        let masterIsFormVisible = false;
        
        // Definición de columnas a mostrar por pestaña
        const columnConfig = {
            'Camion T1': [
                'PATENTE', 'PROPIETARIO', 'MAIL', 'CIA SEGURO', 'VENC VTV', 
                'VENC SEGURO', 'SENASA', 'LICENCIA DE CONDUCIR', 'PAGO MONOTRIBUTO', 
                'POLIZA DE SEGUROS', 'SEGURO DE ACCIDENTES PERSONALES', 
                'CLAUSULA DE NO REPETICION', 'INDUCCION DE CMQ', 
                'CAPACITACION DE MANEJO DEFENSIVO'
            ],
            'Camion T2': [
                'PATENTE', 'CIA SEGURO', 'AÑO', 'VENC VTV', 'VENC SEGURO', 
                'UTA', 'EXTINTOR', 'BOTIQUIN'
            ],
            'Autoelevadores': [
                'CODIGO DE AE', 'CIA SEGURO', 'AÑO', 'VENC SEGURO', 'EXTINTOR'
            ],
            'Choferes y Ayudantes': [
                'APELLIDO Y NOMBRE', 'CONTRATACION', 'Mail', 
                'VENCIMIENTO REGISTRO', 'LIBRETA SANITARIA'
            ]
        };
        
        // Columnas que deben tener formato condicional de fechas por pestaña
        const dateColumnsConfig = {
            'Camion T1': ['VENC VTV', 'VENC SEGURO', 'SENASA', 'LICENCIA DE CONDUCIR', 'PAGO MONOTRIBUTO', 'POLIZA DE SEGUROS', 'SEGURO DE ACCIDENTES PERSONALES', 'CLAUSULA DE NO REPETICION', 'INDUCCION DE CMQ', 'CAPACITACION DE MANEJO DEFENSIVO'],
            'Camion T2': ['VENC VTV', 'VENC SEGURO', 'UTA', 'EXTINTOR', 'BOTIQUIN'],
            'Autoelevadores': ['VENC SEGURO', 'EXTINTOR'],
            'Choferes y Ayudantes': ['VENCIMIENTO REGISTRO', 'LIBRETA SANITARIA']
        };
        
        // Mapeo de filtros por pestaña
        const filterFields = {
            'Camion T1': 'PATENTE',
            'Camion T2': 'PATENTE',
            'Autoelevadores': 'CODIGO DE AE',
            'Choferes y Ayudantes': 'APELLIDO Y NOMBRE'
        };
        
        // Función para mostrar alertas
        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
        
        // Función para parsear fecha en diferentes formatos
        function parseDate(dateStr) {
            if (!dateStr) return null;
            
            dateStr = dateStr.trim();
            if (dateStr === '') return null;
            
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                if (parts.length === 3) {
                    let day = parseInt(parts[0]);
                    let month = parseInt(parts[1]) - 1;
                    let year = parseInt(parts[2]);
                    
                    if (year < 100) {
                        year += 2000;
                    }
                    
                    if (!isNaN(day) && !isNaN(month) && !isNaN(year) && day > 0 && month >= 0 && day <= 31 && month <= 11) {
                        return new Date(year, month, day);
                    }
                }
            }
            
            if (dateStr.includes('-')) {
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    const year = parseInt(parts[0]);
                    const month = parseInt(parts[1]) - 1;
                    const day = parseInt(parts[2]);
                    if (!isNaN(year) && !isNaN(month) && !isNaN(day) && day > 0 && month >= 0 && day <= 31 && month <= 11) {
                        return new Date(year, month, day);
                    }
                }
            }
            
            const date = new Date(dateStr);
            if (!isNaN(date.getTime())) {
                return date;
            }
            
            return null;
        }
        
        // Función para calcular el estado de una fecha
        function getDateStatus(dateStr) {
            if (!dateStr) return { class: '', text: '' };
            
            const expDate = parseDate(dateStr);
            if (!expDate) return { class: '', text: '' };
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            expDate.setHours(0, 0, 0, 0);
            
            const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                return { class: 'date-danger', text: 'VENCIDO' };
            } else if (diffDays >= 0 && diffDays <= 30) {
                return { class: 'date-warning', text: `${diffDays} días` };
            } else {
                return { class: 'date-ok', text: `${diffDays} días` };
            }
        }
        
        // Función para calcular el estado general de la fila
        function getRowStatus(row, sheetName) {
            const dateColumns = dateColumnsConfig[sheetName] || [];
            let hasDate = false;
            let anyExpired = false;
            let anyWarning = false;
            
            dateColumns.forEach(col => {
                if (row[col]) {
                    hasDate = true;
                    const status = getDateStatus(row[col]);
                    if (status.class === 'date-danger') anyExpired = true;
                    else if (status.class === 'date-warning') anyWarning = true;
                }
            });
            
            if (!hasDate) {
                return { class: 'status-ok', text: '✅ Sin fechas' };
            }
            
            if (anyExpired) {
                return { class: 'status-danger', text: '🔴 VENCIDO' };
            } else if (anyWarning) {
                return { class: 'status-warning', text: '🟡 Cerca de vencimiento' };
            } else {
                return { class: 'status-ok', text: '✅ OK' };
            }
        }
        
        // Función para obtener las columnas a mostrar según la pestaña
        function getDisplayColumns(sheetName) {
            const columns = columnConfig[sheetName] || [];
            return [...columns, 'Marca Temporal'];
        }

        // Función para obtener TODAS las columnas de una hoja (usada por Maestro de Flota)
        function getAllColumns(headers) {
            return headers.filter(h => h !== '_row_number' && !h.endsWith('_FOTO'));
        }

        // ==================== NAVEGACIÓN ENTRE MÓDULOS ====================
        function showHome() {
            document.getElementById('homeScreen').style.display = 'flex';
            document.getElementById('docsModule').style.display = 'none';
            document.getElementById('masterModule').style.display = 'none';
        }

        function showModule(module) {
            document.getElementById('homeScreen').style.display = 'none';
            if (module === 'docs') {
                document.getElementById('docsModule').style.display = 'block';
                document.getElementById('masterModule').style.display = 'none';
                loadSheetData(currentSheet);
            } else if (module === 'master') {
                document.getElementById('masterModule').style.display = 'block';
                document.getElementById('docsModule').style.display = 'none';
                loadMasterData(masterCurrentSheet);
            }
        }
        
        // Función para verificar si un valor es una URL de foto
        function isPhotoUrl(value) {
            if (!value) return false;
            return value.startsWith('http') && (value.includes('drive') || value.includes('docs') || value.includes('google'));
        }
        
        // Función para obtener las columnas de fotos
        function getPhotoColumns(headers) {
            return headers.filter(h => h.endsWith('_FOTO'));
        }
        
        // Función para generar campos del formulario dinámicamente
        function generateFormFields(headers, excludeFields = ['_row_number', 'Marca Temporal'], values = {}) {
            let html = '';
            const photoCols = getPhotoColumns(headers);
            
            headers.forEach(header => {
                if (excludeFields.includes(header)) return;
                if (photoCols.includes(header)) return;
                
                const isDate = header.toUpperCase().includes('FECHA') || header.toUpperCase().includes('VENCIMIENTO') || header.toUpperCase().includes('VENC');
                const isTextarea = header.toUpperCase().includes('OBSERVACION') || header.toUpperCase().includes('COMENTARIO');
                const value = values[header] || '';
                
                html += `<div class="form-group">`;
                html += `<label>${header}</label>`;
                
                if (isTextarea) {
                    html += `<textarea id="field_${header}" name="${header}" rows="2">${value}</textarea>`;
                } else if (isDate) {
                    let dateValue = value;
                    if (value && value.includes('/')) {
                        const parts = value.split('/');
                        if (parts.length === 3) {
                            let year = parseInt(parts[2]);
                            if (year < 100) year += 2000;
                            dateValue = `${year}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                    }

        // Función para generar campos de fotos (CORREGIDA)

            html += `<div class="form-group" style="border-top: 2px solid #e0e0e0; padding-top: 15px; margin-top: 15px;">`;

                html += `<label for="${fileInputId}">📷 ${docName}:</label>`;

                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" class="photo-preview" alt="Nueva foto">`;

                    const photoUrl = row[col] || '';
                    const fileInputId = `edit_foto_${docName}`;
                    
                    photoHtml += `<div class="photo-upload-group">`;
                    photoHtml += `<label for="${fileInputId}">📷 ${docName}:</label>`;
                    
                    if (photoUrl && isPhotoUrl(photoUrl)) {
                        let fileId = photoUrl;
                        if (photoUrl.includes('file/d/')) {
                            const match = photoUrl.match(/file\/d\/([^\/]+)/);
                            if (match) {
                                fileId = match[1];
                            }
                        }
                        photoHtml += `<br><img src="https://drive.google.com/thumbnail?id=${fileId}&sz=w100-h100" class="current-photo-thumb" alt="Foto actual">`;
                        photoHtml += `<br><small style="color:#666;">Foto actual - <a href="${photoUrl}" target="_blank">Ver en Drive</a></small>`;
                    } else {
                        photoHtml += `<br><small style="color:#999;">No hay foto cargada</small>`;
                    }
                    
                    photoHtml += `<br><input type="file" id="${fileInputId}" name="${fileInputId}" accept="image/*" onchange="previewPhoto(event, '${fileInputId}')">`;
                    photoHtml += `<div id="preview_${fileInputId}"></div>`;
                    photoHtml += `</div>`;
                });
                
                photoHtml += `</div>`;
            }
            document.getElementById('editPhotoFields').innerHTML = photoHtml;
            
            document.getElementById('editModal').style.display = 'block';
        }
        
        // Función para cerrar el modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
        
        // Event listener para el formulario de edición (CORREGIDO)
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sheetName = document.getElementById('editSheetName').value;
            const rowNumber = parseInt(document.getElementById('editRowNumber').value);
            
            const formData = new FormData(this);
            
            // Verificar si hay alguna foto seleccionada
            let hasPhoto = false;
            const photoCols = getPhotoColumns(currentHeaders);
            
            photoCols.forEach(col => {
                const docName = col.replace('_FOTO', '');
                const fileInput = document.getElementById(`edit_foto_${docName}`);
                if (fileInput && fileInput.files && fileInput.files.length > 0) {
                    hasPhoto = true;
                    formData.append(`foto_${docName}`, fileInput.files[0]);
                }
            });
            
            // Eliminar los campos edit_foto_ originales
            const keysToDelete = [];
            for (let key of formData.keys()) {
                if (key.startsWith('edit_foto_')) {
                    keysToDelete.push(key);
                }
            }
            keysToDelete.forEach(key => formData.delete(key));
            
            try {
                let response;
                if (hasPhoto) {
                    response = await fetch(`/api/update_with_photo/${encodeURIComponent(sheetName)}/${rowNumber}`, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    const jsonData = {};
                    for (let [key, value] of formData.entries()) {
                        if (!key.startsWith('foto_') && key !== 'sheetName' && key !== 'rowNumber') {
                            jsonData[key] = value;
                        }
                    }
                    response = await fetch(`/api/update/${encodeURIComponent(sheetName)}/${rowNumber}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(jsonData)
                    });
                }
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('✅ Documento actualizado correctamente', 'success');
                    closeEditModal();
                    if (editContextModule === 'master') {
                        await loadMasterData(sheetName);
                    } else {
                        await loadSheetData(sheetName);
                    }
                } else {
                    showAlert(`❌ Error: ${result.error}`, 'error');
                }
            } catch (error) {
                showAlert(`❌ Error al actualizar: ${error.message}`, 'error');
            }
        });
        
        // Función para eliminar una fila
        async function deleteRow(sheetName, rowNumber) {
            if (!confirm('¿Estás seguro de que deseas eliminar este documento?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/delete/${encodeURIComponent(sheetName)}/${rowNumber}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('✅ Documento eliminado correctamente', 'success');
                    await loadSheetData(sheetName);
                } else {
                    showAlert(`❌ Error: ${result.error}`, 'error');
                }
            } catch (error) {
                showAlert(`❌ Error al eliminar: ${error.message}`, 'error');
            }
        }
        
        // Configurar tabs del módulo Control de Documentación
        document.querySelectorAll('#tabsDocs .tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#tabsDocs .tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                const sheetName = this.dataset.sheet;
                currentSheet = sheetName;
                isFormVisible = false;
                loadSheetData(sheetName);
            });
        });

        // Configurar tabs del módulo Maestro de Flota
        document.querySelectorAll('#tabsMaster .tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#tabsMaster .tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                const sheetName = this.dataset.sheet;
                masterCurrentSheet = sheetName;
                masterIsFormVisible = false;
                loadMasterData(sheetName);
            });
        });

        // Al iniciar, se muestra la pantalla de inicio con los 2 botones
        showHome();
    </script>
</body>
</html>
