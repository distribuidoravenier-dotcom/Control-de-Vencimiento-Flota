<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Flota</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 10px;
  }
  .container {
    max-width: 100%; margin: 0 auto; background: #fff;
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    padding: 26px;
  }
  h1 { color:#333; margin-bottom: 4px; font-size: 26px; }
  .subtitle { color:#666; margin-bottom: 20px; font-size: 14px; }

  /* ===== VISTA HOME (MÓDULOS) ===== */
  .home-view {
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; min-height: 70vh; text-align:center;
  }
  .home-view h1 { font-size: 34px; margin-bottom: 8px; }
  .home-view .subtitle { font-size: 16px; margin-bottom: 40px; }
  .modules {
    display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px; width:100%; max-width: 600px;
  }
  .module-card {
    background:#f8f9fa; border:2px solid #e0e0e0; border-radius:12px;
    padding: 30px 20px; cursor:pointer; transition:.2s;
    display:block; text-align:center;
  }
  .module-card:hover {
    border-color:#667eea; background:#fff; transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(102,126,234,.25);
  }
  .module-icon { font-size: 48px; margin-bottom: 12px; }
  .module-title { font-size: 18px; font-weight:700; color:#333; margin-bottom:6px; }
  .module-desc { font-size: 13px; color:#666; }

  /* ===== VISTA MÓDULO ===== */
  .module-view { display:none; }
  .module-view.active { display:block; }
  .home-view.hidden { display:none; }

  .breadcrumb {
    font-size: 13px; color:#666; margin-bottom: 10px;
  }
  .breadcrumb a {
    color:#667eea; text-decoration:none; font-weight:600; cursor:pointer;
  }
  .breadcrumb a:hover { text-decoration:underline; }

  /* ===== SOLAPAS ===== */
  .tabs {
    display:flex; gap:4px; border-bottom:2px solid #e0e0e0;
    margin-bottom: 18px;
  }
  .tab {
    padding: 10px 22px; border:none; background:transparent;
    cursor:pointer; font-size:14px; font-weight:600; color:#666;
    border-bottom: 3px solid transparent; margin-bottom:-2px;
    transition:.15s; font-family:inherit;
  }
  .tab:hover { color:#667eea; background:#f8f9fa; }
  .tab.active {
    color:#667eea; border-bottom-color:#667eea;
  }

  .toolbar {
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    background:#f8f9fa; padding:14px; border-radius:8px; margin-bottom:16px;
  }
  .toolbar input[type="text"] {
    flex:1; min-width:220px; padding:9px 12px; border:1px solid #ddd;
    border-radius:6px; font-size:14px;
  }
  .btn {
    background:#667eea; color:#fff; border:none; padding:9px 18px;
    border-radius:6px; cursor:pointer; font-weight:600; font-size:14px;
    transition:.15s; white-space: nowrap;
  }
  .btn:hover { background:#5a67d8; transform: translateY(-1px); }
  .btn-success { background:#38a169; } .btn-success:hover { background:#2f855a; }
  .btn-danger  { background:#e53e3e; } .btn-danger:hover  { background:#c53030; }
  .btn-cancel  { background:#718096; } .btn-cancel:hover  { background:#4a5568; }
  .btn-sm { padding:5px 9px; font-size:12px; }

  .alert { padding:12px 16px; border-radius:6px; margin-bottom:14px; font-weight:600; font-size:14px; }
  .alert-success { background:#c6f6d5; color:#22543d; }
  .alert-error   { background:#fed7d7; color:#742a2a; }

  .table-wrapper {
    overflow:auto; max-height: 620px;
    border:1px solid #e0e0e0; border-radius:8px;
    position: relative;
  }
  table { width:100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  th {
    background:#667eea; color:#fff; padding:10px 8px;
    text-align:left; position: sticky; top:0; z-index:5;
    white-space:nowrap; font-size:12px;
    border-bottom: 1px solid #5a67d8;
  }
  td {
    padding:7px 9px; border-bottom:1px solid #eee;
    white-space:nowrap; vertical-align: middle;
    background: #ffffff;
  }
  tr:hover td { background:#f8f9fa; }

  /* ================================================
     COLUMNAS FIJAS (sticky horizontal)
     ================================================ */
  th.col-acciones {
    position: sticky; left: 0; z-index: 7;
    background: #667eea;
    min-width: 110px; width: 110px;
  }
  th.col-flota {
    position: sticky; left: 110px; z-index: 7;
    background: #667eea;
    min-width: 100px; width: 100px;
  }
  th.col-patente {
    position: sticky; left: 210px; z-index: 7;
    background: #667eea;
    min-width: 110px; width: 110px;
    box-shadow: 3px 0 6px -2px rgba(0,0,0,.25);
  }
  td.col-acciones {
    position: sticky; left: 0; z-index: 4;
    background: #ffffff;
    min-width: 110px; width: 110px;
  }
  td.col-flota {
    position: sticky; left: 110px; z-index: 4;
    background: #ffffff;
    min-width: 100px; width: 100px;
  }
  td.col-patente {
    position: sticky; left: 210px; z-index: 4;
    background: #ffffff;
    min-width: 110px; width: 110px;
    box-shadow: 3px 0 6px -2px rgba(0,0,0,.25);
  }
  tr:hover td.col-acciones,
  tr:hover td.col-flota,
  tr:hover td.col-patente {
    background: #f8f9fa;
  }

  .pk-badge {
    background:#fefcbf; color:#744210; padding:2px 6px;
    border-radius:4px; font-size:10px; font-weight:700; margin-left:4px;
  }
  .status-sale    { background:#c6f6d5; color:#22543d; padding:3px 8px; border-radius:4px; font-weight:700; font-size:11px; }
  .status-nosale  { background:#fed7d7; color:#742a2a; padding:3px 8px; border-radius:4px; font-weight:700; font-size:11px; }
  .status-si      { background:#c6f6d5; color:#22543d; padding:3px 8px; border-radius:4px; font-weight:700; font-size:11px; }
  .status-no      { background:#e2e8f0; color:#2d3748; padding:3px 8px; border-radius:4px; font-weight:700; font-size:11px; }
  .date-ok        { background:#c6f6d5; color:#22543d; padding:3px 8px; border-radius:4px; font-weight:600; font-size:11px; }
  .date-warning   { background:#fefcbf; color:#744210; padding:3px 8px; border-radius:4px; font-weight:600; font-size:11px; }
  .date-danger    { background:#fed7d7; color:#742a2a; padding:3px 8px; border-radius:4px; font-weight:600; font-size:11px; }

  .actions { display:flex; gap:4px; }

  .modal {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
    z-index:100; align-items:flex-start; justify-content:center;
    overflow-y:auto; padding: 30px 16px;
  }
  .modal.open { display:flex; }
  .modal-content {
    background:#fff; border-radius:10px; padding:26px;
    width:100%; max-width:820px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .modal-content h2 { margin-bottom:18px; color:#333; font-size: 20px; }
  .form-grid {
    display:grid; grid-template-columns: 1fr 1fr; gap:14px;
  }
  .form-group { display:flex; flex-direction:column; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label {
    font-weight:600; margin-bottom:4px; color:#333; font-size:12px;
    text-transform: uppercase; letter-spacing: .3px;
  }
  .form-group input,
  .form-group select {
    padding:9px 11px; border:1px solid #ddd; border-radius:6px; font-size:14px;
    font-family: inherit;
  }
  .form-group input:focus,
  .form-group select:focus { outline:none; border-color:#667eea; }
  .form-group input[readonly] { background:#f0f0f0; cursor:not-allowed; }
  .modal-buttons {
    display:flex; gap:10px; justify-content:flex-end; margin-top:22px;
    padding-top:18px; border-top:1px solid #eee;
  }
  .no-data { text-align:center; padding:40px; color:#999; }

  @media (max-width: 720px) {
    .form-grid { grid-template-columns: 1fr; }
    td, th { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- ===================== VISTA HOME ===================== -->
  <div class="home-view" id="homeView">
    <h1>🚛 Gestión de Flota</h1>
    <p class="subtitle">Seleccioná un módulo para comenzar</p>

    <div class="modules">
      <div class="module-card" onclick="openModule('maestro_flota')">
        <div class="module-icon">📋</div>
        <div class="module-title">Maestro de Flota</div>
        <div class="module-desc">Camiones T2 · Maestro AE</div>
      </div>
    </div>
  </div>

  <!-- ===================== VISTA MÓDULO ===================== -->
  <div class="module-view" id="moduleView">
    <div class="breadcrumb">
      <a onclick="goHome()">🏠 Inicio</a> / <span id="breadcrumbModule">Maestro de Flota</span>
    </div>
    <h1 id="moduleTitle">📋 Maestro de Flota</h1>
    <p class="subtitle">Administración de la flota · Primary Key: <b>PATENTE</b></p>

    <div class="tabs" id="tabsContainer">
      {% for key, cfg in sheets.items() %}
      <button class="tab" data-sheet-key="{{ key }}" onclick="switchSheet('{{ key }}')">
        {{ cfg.label }}
      </button>
      {% endfor %}
    </div>

    <div id="alert-container"></div>

    <div class="toolbar">
      <button class="btn btn-success" onclick="openAddModal()">➕ Agregar</button>
      <input type="text" id="filterInput" placeholder="🔍 Buscar..." oninput="applyFilter()">
      <button class="btn btn-cancel" onclick="clearFilter()">✖ Limpiar</button>
      <span id="recordCount" style="color:#666; font-size:14px;">Total: 0</span>
    </div>

    <div class="table-wrapper">
      <table id="maestroTable">
        <thead id="maestroHead"></thead>
        <tbody id="maestroBody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal Agregar / Editar -->
<div class="modal" id="rowModal">
  <div class="modal-content">
    <h2 id="rowModalTitle">➕ Agregar</h2>
    <div class="form-grid" id="rowModalFields"></div>
    <div class="modal-buttons">
      <button class="btn btn-cancel" onclick="closeModal('rowModal')">Cancelar</button>
      <button class="btn btn-success" onclick="submitRow()">💾 Guardar</button>
    </div>
  </div>
</div>

<script>
let COLUMNS = [];
let PRIMARY_KEY = 'PATENTE';
let allRows = [];
let filteredRows = [];
let editingRowNumber = null;
let headers = [];
let currentSheetKey = null;

/* ============ HELPERS ============ */
function showAlert(msg, type='success') {
  const c = document.getElementById('alert-container');
  const div = document.createElement('div');
  div.className = 'alert alert-' + type;
  div.textContent = msg;
  c.appendChild(div);
  setTimeout(() => div.remove(), 4500);
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

/* ============ NAVEGACIÓN ============ */
function openModule(moduleKey) {
  document.getElementById('homeView').classList.add('hidden');
  document.getElementById('moduleView').classList.add('active');

  // Inicializar con la primera solapa
  const firstTab = document.querySelector('.tab');
  if (firstTab) {
    switchSheet(firstTab.dataset.sheetKey);
  }
}

function goHome() {
  document.getElementById('moduleView').classList.remove('active');
  document.getElementById('homeView').classList.remove('hidden');
  document.getElementById('alert-container').innerHTML = '';
}

/* ============ CÁLCULO DE VENCIMIENTOS ============ */
function parseDate(str) {
  if (!str) return null;
  str = String(str).trim();
  if (!str) return null;
  let m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    let [_, d, mo, y] = m;
    if (y.length === 2) y = '20' + y;
    return new Date(+y, +mo - 1, +d);
  }
  m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  const d = new Date(str);
  return isNaN(d) ? null : d;
}
function formatDate(date) {
  if (!date) return '';
  const d = String(date.getDate()).padStart(2,'0');
  const m = String(date.getMonth()+1).padStart(2,'0');
  const y = date.getFullYear();
  return `${d}/${m}/${y}`;
}
function dateToInputValue(str) {
  const d = parseDate(str);
  if (!d) return '';
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}
function dateStatusClass(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  const diff = Math.ceil((d - today) / 86400000);
  if (diff < 0) return 'date-danger';
  if (diff <= 30) return 'date-warning';
  return 'date-ok';
}

/* ============ SOLAPAS ============ */
async function switchSheet(sheetKey) {
  currentSheetKey = sheetKey;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.sheetKey === sheetKey);
  });
  document.getElementById('filterInput').value = '';
  await loadConfig();
  await loadRows();
}

/* ============ CARGA ============ */
async function loadConfig() {
  const res = await fetch('/api/config/' + currentSheetKey);
  const data = await res.json();
  if (data.success) {
    COLUMNS = data.columns;
    PRIMARY_KEY = data.primaryKey;
    headers = COLUMNS.map(c => c.name);
  }
}

async function loadRows() {
  try {
    const res = await fetch('/api/rows/' + currentSheetKey);
    const data = await res.json();
    if (!data.success) { showAlert('Error: ' + data.error, 'error'); return; }
    allRows = data.rows || [];
    filteredRows = allRows.slice();
    render();
  } catch (e) {
    showAlert('Error de conexión: ' + e.message, 'error');
  }
}

/* ============ RENDER ============ */
function render() {
  const thead = document.getElementById('maestroHead');
  const tbody = document.getElementById('maestroBody');

  // HEAD
  let headHtml = '<tr><th class="col-acciones">Acciones</th>';
  COLUMNS.forEach(col => {
    const pk = col.name === PRIMARY_KEY ? '<span class="pk-badge">PK</span>' : '';
    let cls = '';
    if (col.name === 'FLOTA') cls = ' class="col-flota"';
    else if (col.name === PRIMARY_KEY) cls = ' class="col-patente"';
    headHtml += `<th${cls}>${escapeHtml(col.name)}${pk}</th>`;
  });
  headHtml += '</tr>';
  thead.innerHTML = headHtml;

  // BODY
  if (filteredRows.length === 0) {
    tbody.innerHTML = `<tr><td class="no-data" colspan="${COLUMNS.length + 1}">Sin registros</td></tr>`;
  } else {
    let bodyHtml = '';
    filteredRows.forEach(row => {
      bodyHtml += '<tr>';
      bodyHtml += `<td class="col-acciones">
        <div class="actions">
          <button class="btn btn-sm" onclick="editRow(${row._row_number})">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="deleteRow(${row._row_number})">🗑️</button>
        </div>
      </td>`;
      COLUMNS.forEach(col => {
        const raw = row[col.name] || '';
        let cell = escapeHtml(raw);
        let cls = '';
        if (col.name === 'FLOTA') cls = 'col-flota';
        else if (col.name === PRIMARY_KEY) cls = 'col-patente';

        if (col.name === 'STATUS') {
          const c = raw === 'SALE' ? 'status-sale' : (raw === 'NO SALE' ? 'status-nosale' : '');
          cell = c ? `<span class="${c}">${escapeHtml(raw)}</span>` : escapeHtml(raw);
        } else if (col.type === 'select' && (col.name === 'Cumple Polìtica?' || col.name === 'Tiene telemetria')) {
          const c = raw === 'SI' ? 'status-si' : (raw === 'NO' ? 'status-no' : '');
          cell = c ? `<span class="${c}">${escapeHtml(raw)}</span>` : escapeHtml(raw);
        } else if (col.type === 'date' && raw) {
          const c = dateStatusClass(raw);
          cell = c ? `<span class="${c}">${escapeHtml(raw)}</span>` : escapeHtml(raw);
        } else if (col.name === PRIMARY_KEY) {
          cell = `<b>${escapeHtml(raw)}</b>`;
        }
        bodyHtml += `<td class="${cls}">${cell}</td>`;
      });
      bodyHtml += '</tr>';
    });
    tbody.innerHTML = bodyHtml;
  }

  document.getElementById('recordCount').textContent = 'Total: ' + filteredRows.length;
}

/* ============ FILTRO ============ */
function applyFilter() {
  const q = document.getElementById('filterInput').value.toLowerCase().trim();
  if (!q) filteredRows = allRows.slice();
  else filteredRows = allRows.filter(r =>
    headers.some(h => String(r[h] || '').toLowerCase().includes(q))
  );
  render();
}
function clearFilter() {
  document.getElementById('filterInput').value = '';
  filteredRows = allRows.slice();
  render();
}

/* ============ MODAL ============ */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function buildForm(values = {}) {
  let html = '';
  COLUMNS.forEach(col => {
    const val = values[col.name] || '';
    const isPk = col.name === PRIMARY_KEY;
    const full = (col.name === 'CIA SEGURO' || col.name.includes('Capacidad')) ? ' full' : '';

    html += `<div class="form-group${full}">`;
    html += `<label>${escapeHtml(col.name)}${isPk ? ' <span style="color:#e53e3e;">*</span>' : ''}</label>`;

    if (col.type === 'select') {
      html += `<select data-field="${escapeHtml(col.name)}">`;
      html += `<option value="">-- Seleccionar --</option>`;
      col.options.forEach(opt => {
        const sel = (val === opt) ? ' selected' : '';
        html += `<option value="${escapeHtml(opt)}"${sel}>${escapeHtml(opt)}</option>`;
      });
      html += `</select>`;
    } else if (col.type === 'date') {
      html += `<input type="date" data-field="${escapeHtml(col.name)}" value="${dateToInputValue(val)}">`;
    } else if (col.type === 'number') {
      html += `<input type="number" step="any" data-field="${escapeHtml(col.name)}" value="${escapeHtml(val)}">`;
    } else {
      html += `<input type="text" data-field="${escapeHtml(col.name)}" value="${escapeHtml(val)}">`;
    }
    html += `</div>`;
  });
  document.getElementById('rowModalFields').innerHTML = html;
}

function openAddModal() {
  editingRowNumber = null;
  document.getElementById('rowModalTitle').textContent = '➕ Agregar';
  buildForm({});
  openModal('rowModal');
}

function editRow(rowNumber) {
  const row = allRows.find(r => r._row_number === rowNumber);
  if (!row) return;
  editingRowNumber = rowNumber;
  document.getElementById('rowModalTitle').textContent = '✏️ Editar';
  buildForm(row);
  openModal('rowModal');
}

async function submitRow() {
  const values = {};
  document.querySelectorAll('#rowModalFields [data-field]').forEach(inp => {
    const field = inp.dataset.field;
    const col = COLUMNS.find(c => c.name === field);

    if (col && col.type === 'date') {
      values[field] = inp.value ? formatDate(new Date(inp.value + 'T00:00:00')) : '';
    } else {
      values[field] = inp.value;
    }
  });

  if (!String(values[PRIMARY_KEY] || '').trim()) {
    showAlert(`El campo ${PRIMARY_KEY} es obligatorio`, 'error');
    return;
  }

  try {
    let res;
    if (editingRowNumber === null) {
      res = await fetch('/api/rows/' + currentSheetKey, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ values })
      });
    } else {
      res = await fetch('/api/rows/' + currentSheetKey + '/' + editingRowNumber, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ values })
      });
    }
    const data = await res.json();
    if (data.success) {
      showAlert(editingRowNumber === null ? '✅ Registro agregado' : '✅ Registro actualizado');
      closeModal('rowModal');
      await loadRows();
    } else {
      showAlert('❌ ' + data.error, 'error');
    }
  } catch (e) {
    showAlert('Error: ' + e.message, 'error');
  }
}

async function deleteRow(rowNumber) {
  const row = allRows.find(r => r._row_number === rowNumber);
  const label = row ? row[PRIMARY_KEY] : '';
  if (!confirm(`¿Eliminar el registro "${label}"?`)) return;
  try {
    const res = await fetch('/api/rows/' + currentSheetKey + '/' + rowNumber, { method:'DELETE' });
    const data = await res.json();
    if (data.success) {
      showAlert('✅ Registro eliminado');
      await loadRows();
    } else {
      showAlert('❌ ' + data.error, 'error');
    }
  } catch (e) {
    showAlert('Error: ' + e.message, 'error');
  }
}

/* Cerrar modal clickeando afuera */
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});
</script>
</body>
</html>
